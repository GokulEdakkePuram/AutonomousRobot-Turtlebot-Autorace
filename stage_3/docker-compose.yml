services:
  test-service:
    container_name: ros2-ar-new
    image: fbe-dockerreg.rwu.de/doz-iki/staehle-vls/amr-tb3:latest
    environment:
      DISPLAY: $DISPLAY
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: $ROS_DOMAIN_ID
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/root/.Xauthority
      - $IKI_WORKSPACE:/root
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    command:
      - bash
      - -c
      - |
        tail -f /dev/null
